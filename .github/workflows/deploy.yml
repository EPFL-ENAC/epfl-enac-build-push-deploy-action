---
name: deploy

on:
  workflow_call:
    inputs:
      argo_repository:
        required: false
        type: string
        default: '["EPFL-ENAC/enack8s-app-config"]'
        description: "JSON array of argo repos (legacy, used when registries is not set)"
      org:
        required: true
        type: string
      repo:
        required: true
        type: string
      lfs:
        # perform git lfs pull at checkout time
        required: false
        type: boolean
        default: false
      submodules:
        # whether to checkout submodules
        # `true` to checkout submodules or `recursive` to recursively checkout submodules
        required: false
        type: string
        default: false
      build_args:
        required: false
        type: string
        default: ""
        description: |
          Additional Docker build-args, one KEY=VALUE per line. Appended to the
          built-in SSH_PRIVATE_KEY arg. Useful for passing GIT_SHA, version
          tags, etc. into the build. Unconsumed args are harmless (Docker just
          warns).
      build_args_script:
        required: false
        type: string
        default: ""
        description: |
          Shell script run in each build job after checkout, from the
          repository root. Every stdout line is a KEY=VALUE build arg appended
          to build_args; write diagnostics to stderr. Replaces a separate
          caller job for values that need the checkout (a version file, a
          commit date), which costs ~10s of job boundaries per run.
      build_context:
        required: false
        type: string
        default: '["./"]'
      reuse_unchanged_images:
        required: false
        type: boolean
        default: false
        description: |
          Opt in to skip the build when an image's inputs are unchanged since
          the last image pushed for this branch: the existing image is
          re-tagged with the new sha, rescanned (see rescan_reused_images)
          and distributed as usual. Inputs = the git tree of the build
          context plus build_key_paths. Tag builds always rebuild. The reused
          image keeps the build args it was built with (a baked-in version
          stamp stays that of the commit that last changed the context).
      rescan_reused_images:
        required: false
        type: boolean
        default: true
        description: |
          Run the Trivy scan on a reused image too (pulled from ghcr, 6 to
          13s), so a CVE published since it was built still blocks the
          rollout exactly as a rebuild would. Set false only if a scheduled
          scan of the registry (registry-scan.yml) covers that project.
      build_key_paths:
        required: false
        type: string
        default: ""
        description: |
          Repo paths outside the build contexts that must also trigger a
          rebuild when they change, one per line (a root package.json a
          version stamp is read from, for example).
      image_name: # work only for "./" build context, to override default's default
        required: false
        type: string
        default: ""
      create_pull_request:
        required: false
        type: boolean
        default: false
      registries:
        required: false
        type: string
        default: ""
        description: |
          JSON array of registry configs for multi-registry push.
          Each entry: {"registry":"ghcr.io","registry_path":"","registry_username":"","argo_repositories":["EPFL-ENAC/enack8s-app-config"]}
          First non-ghcr registry uses registry_token secret, second uses registry_token_2.
          If empty, falls back to single registry/registry_path/registry_username inputs.
      registry:
        required: false
        type: string
        default: "ghcr.io"
      registry_path:
        required: false
        type: string
        default: ""
      registry_username:
        required: false
        type: string
        default: "${{ github.actor }}"
      helm_chart_name:
        required: false
        type: string
        default: ""
      helm_chart_version:
        required: false
        type: string
        default: ""
        description: "Chart version to write into the manifest. Ignored when helm_chart_path is set (the publish-chart job computes it)."
      helm_chart_path:
        required: false
        type: string
        default: ""
        description: |
          Directory of a Helm chart to package and push to
          oci://ghcr.io/<repository-lowercased>/helm as 1.0.<run_number>[-dev|-rc].
          Runs alongside the image builds; only update-manifest waits for it.
      helm_chart_render_args:
        required: false
        type: string
        default: ""
        description: |
          Smoke-test renders before packaging: one `helm template` per
          non-empty line, each line appended as extra arguments. Empty runs a
          single plain render.
      skip_vulnerability_scan:
        required: false
        type: boolean
        default: true
    secrets:
      token:
        required: true
      private_key:
        required: false
      registry_token:
        required: false
      registry_token_2:
        required: false

env:
  CD_ORG: ${{ inputs.org }}
  CD_REPO: ${{ inputs.repo }}
  IMAGE_NAME: ${{ inputs.image_name }}
  CREATE_PULL_REQUEST: ${{ inputs.create_pull_request }}

# Architecture: build once → push to ghcr → crane-copy the same digest to other registries → update N manifest repos
# ghcr.io is always the source of truth; other registries receive byte-identical copies (same digest).
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      manifest_matrix: ${{ steps.set-matrix.outputs.manifest_matrix }}
    steps:
      - name: Checkout repository
        # depth 1 is enough: build keys are tree hashes of HEAD, no history
        uses: actions/checkout@v7

      - name: Install crane (pinned)
        run: |
          CRANE_VERSION=v0.21.7
          CRANE_SHA256=1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c
          tar xzf crane.tar.gz crane
          sudo mv crane /usr/local/bin/
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: lowercase repo owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV};

      - name: Set image name
        shell: bash
        run: |
          IMAGE_NAME=$( if [ -n "${{ env.IMAGE_NAME }}" ]; then echo "${{ env.IMAGE_NAME }}"; else echo "${{ env.CD_REPO }}"; fi );
          echo $IMAGE_NAME;
          echo "IMAGE_NAME=\"$IMAGE_NAME\"" >> ${GITHUB_ENV};

      - name: Build matrices
        id: set-matrix
        shell: bash
        env:
          REUSE: ${{ inputs.reuse_unchanged_images }}
          KEY_PATHS: ${{ inputs.build_key_paths }}
        run: |
          # --- Determine registries configuration ---
          registries_input='${{ inputs.registries }}'
          if [ -z "$registries_input" ]; then
            # Fallback: build from legacy single-registry inputs
            registries_json='[{"registry":"${{ inputs.registry }}","registry_path":"${{ inputs.registry_path }}","registry_username":"${{ inputs.registry_username }}","argo_repositories":${{ inputs.argo_repository }}}]'
          else
            registries_json="$registries_input"
          fi
          echo "Registries: $registries_json"

          # --- Build matrix (builds and pushes to ghcr, the source of truth) ---
          owner="${{ env.OWNER }}"
          org="${{ env.CD_ORG }}"
          repo="${{ env.CD_REPO }}"
          input_json=${{ toJson(inputs.build_context) }};
          echo "Build contexts: $input_json";
          build_matrix=$(echo "$input_json" | jq -c \
            --arg owner "$owner" \
            --arg org "$org" \
            --arg repo "$repo" \
            'to_entries | map(
            (.value | rtrimstr("/")) as $ctx
            | ($ctx == "." or $ctx == "./") as $root
            | ($ctx | split("/") | .[-1]) as $leaf
            | {
                dockerfile: (if $root then "./Dockerfile" else ($ctx + "/Dockerfile") end),
                context: (if $root then "." else $ctx end),
                name: (if $root then (${{ env.IMAGE_NAME }}) else $leaf end),
                id: (.key + 1)
              }
            | . + {
                ghcr_image: (if .context == "." then
                    ("ghcr.io/" + $owner + "/" + $org + "/" + .name)
                  else
                    ("ghcr.io/" + $owner + "/" + $org + "/" + $repo + "/" + .name)
                  end)
              }
          )')
          # --- Push targets (cross-product: build contexts × registries) ---
          push_matrix=$(echo "$registries_json" | jq -c \
            --argjson builds "$build_matrix" \
            --arg owner "$owner" \
            --arg org "$org" \
            --arg repo "$repo" \
            '
            # Compute sequential index among non-ghcr registries
            [to_entries[] | select(.value.registry != "ghcr.io")] as $non_ghcr |
            [
              to_entries[] | .key as $ri | .value as $reg |
              (if $reg.registry == "ghcr.io" then 0
               else ([$non_ghcr | to_entries[] | select(.value.key == $ri)][0].key + 1)
               end) as $non_ghcr_idx |
              $builds[] |
              {
                name: .name,
                build_id: .id,
                registry: $reg.registry,
                registry_path: ($reg.registry_path // ""),
                registry_username: ($reg.registry_username // ""),
                non_ghcr_index: $non_ghcr_idx,
                source_image: .ghcr_image,
                image: (
                  if $reg.registry == "ghcr.io" then
                    .ghcr_image
                  else
                    if (($reg.registry_path // "") | length) > 0 then
                      ($reg.registry + "/" + $reg.registry_path + "/" + .name)
                    else
                      ($reg.registry + "/" + .name)
                    end
                  end
                ),
                push_id: ("r" + ($ri + 1 | tostring) + "_c" + (.id | tostring))
              }
            ]')
          # Each build job copies its own image to every registry, so the
          # targets ride along inside the build matrix entry instead of
          # fanning out into a second job per (image × registry).
          build_matrix=$(jq -nc --argjson b "$build_matrix" --argjson p "$push_matrix" \
            '$b | map(.id as $id | . + {targets: [$p[] | select(.build_id == $id)]})')
          # --- Reuse: skip images whose inputs did not change since the last
          # image pushed for this branch. Key = sha256 over the git tree of the
          # context and of every build_key_paths entry; the previous key is the
          # enac.build.key label on <image>:<branch tag>. Tag refs always build.
          branch_tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          key_for() {
            ctx="${1#./}"
            { if [ "$ctx" = "." ]; then git rev-parse "HEAD^{tree}"; else git rev-parse "HEAD:$ctx"; fi
              while IFS= read -r p; do [ -z "$p" ] || git rev-parse "HEAD:$p"; done <<< "$KEY_PATHS"
            } | sha256sum | cut -c1-40
          }
          reuse_json='[]'
          {
            echo "### Images"
            echo
            echo "| Image | Decision | Build key | Previous key (\`$branch_tag\` tag) |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for entry in $(jq -c '.[]' <<< "$build_matrix"); do
            ctx=$(jq -r .context <<< "$entry"); image=$(jq -r .ghcr_image <<< "$entry")
            key=$(key_for "$ctx"); prev=""; digest=""
            if [ "$REUSE" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
              # no image under this branch tag yet (first push, new branch) is
              # a normal case, not an error: the step runs with pipefail
              prev=$(crane config "$image:$branch_tag" 2>/dev/null | jq -r '.config.Labels["enac.build.key"] // ""' || true)
              [ -z "$prev" ] || digest=$(crane digest "$image:$branch_tag")
            fi
            reuse=false; mode=build; [ -n "$prev" ] && [ "$prev" = "$key" ] && { reuse=true; mode=reuse; }
            name=$(jq -r .name <<< "$entry")
            echo "$name: key=$key previous=${prev:-none} reuse=$reuse"
            case "$GITHUB_REF_TYPE:$REUSE:$prev" in
              tag:*)     why="tag build: always rebuilt" ;;
              *:true:)   why="no image under this tag yet: first build" ;;
              *:true:*)  why=$([ "$reuse" = true ] && echo "inputs unchanged: re-tagged, no build" || echo "inputs changed: rebuilt") ;;
              *)         why="reuse_unchanged_images is off: rebuilt" ;;
            esac
            echo "| $name | **$mode** ($why) | \`${key:0:12}\` | \`${prev:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
            reuse_json=$(jq -c --arg id "$(jq -r .id <<< "$entry")" --arg key "$key" --argjson reuse "$reuse" --arg digest "$digest" --arg mode "$mode" \
              '. + [{id: ($id | tonumber), build_key: $key, reuse: $reuse, reuse_digest: $digest, mode: $mode}]' <<< "$reuse_json")
          done
          build_matrix=$(jq -nc --argjson b "$build_matrix" --argjson r "$reuse_json" \
            '$b | map(.id as $id | . + ($r[] | select(.id == $id) | del(.id)))')
          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $build_matrix"

          # --- Manifest matrix (argo repos with their associated registry) ---
          manifest_matrix=$(echo "$registries_json" | jq -c '[
            to_entries[] | .value as $reg |
            ($reg.argo_repositories // [])[] |
            {
              argo_repository: .,
              registry: $reg.registry
            }
          ]')
          echo "manifest_matrix=$manifest_matrix" >> "$GITHUB_OUTPUT"
          echo "Manifest matrix: $manifest_matrix"

      - name: Echo matrices
        shell: bash
        run: |
          echo "Build: ${{ steps.set-matrix.outputs.build_matrix }}"
          echo "Manifest: ${{ steps.set-matrix.outputs.manifest_matrix }}"

  build:
    # "build frontend" or "reuse frontend": the decision is readable from the run graph
    name: ${{ matrix.mode }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.define-matrix.outputs.build_matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        if: ${{ !matrix.reuse }}
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}
          submodules: ${{ inputs.submodules }}

      - name: Set up Docker Buildx
        if: ${{ !matrix.reuse }}
        uses: docker/setup-buildx-action@v4
        with:
          # the runner is discarded after the job; `docker buildx rm` in
          # post-cleanup costs ~8s for nothing
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: build-args
        if: ${{ !matrix.reuse && inputs.build_args_script != '' }}
        env:
          SCRIPT: ${{ inputs.build_args_script }}
        run: |
          {
            echo 'resolved<<BUILD_ARGS_EOF'
            bash -e -o pipefail -c "$SCRIPT"
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to GHCR
        if: ${{ !matrix.reuse }}
        id: build
        uses: docker/build-push-action@v7
        env:
          # skip v6's default build-record artifact upload; summary alone is enough
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # no provenance attestation: nothing downstream consumes it and it
          # adds an unknown/unknown manifest to the pushed index
          provenance: false
          push: true
          tags: ${{ matrix.ghcr_image }}:${{ github.sha }}
          # read back by define-matrix on the next run to decide reuse
          labels: enac.build.key=${{ matrix.build_key }}
          build-args: |
            SSH_PRIVATE_KEY=${{ secrets.private_key }}
            ${{ inputs.build_args }}
            ${{ steps.build-args.outputs.resolved }}
          # Also write the image as a docker archive so Trivy scans it from
          # disk: pulling it back from ghcr cost 9 to 11s on a 94MB image,
          # the walk itself 3 to 4s.
          outputs: ${{ inputs.skip_vulnerability_scan == false && 'type=docker,dest=/tmp/image.tar' || '' }}
          # layer cache lives next to the image on ghcr under a :buildcache
          # tag: one blob push per layer, no gha cache api chunking, no 10GB
          # per-repo eviction. mode=max keeps intermediate stages (deps).
          cache-from: type=registry,ref=${{ matrix.ghcr_image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.ghcr_image }}:buildcache,mode=max

      - name: Install Trivy (pinned)
        if: ${{ inputs.skip_vulnerability_scan == false && (!matrix.reuse || inputs.rescan_reused_images) }}
        run: |
          # Version-pinned with a hardcoded checksum: installing from a live
          # apt repo or action would run whatever it serves that day as root.
          TRIVY_VERSION=0.72.0
          TRIVY_SHA256=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c
          # single static binary; dpkg spends ~3s reading the package db
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 755 trivy /usr/local/bin/trivy

      - name: Scan image with Trivy
        if: ${{ !matrix.reuse && inputs.skip_vulnerability_scan == false }}
        run: |
          trivy image \
            --skip-version-check \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --input /tmp/image.tar

      # ---- Distribute: the same digest to every registry, in this job. A
      # separate push job per (image × registry) cost 6 to 13s of runner
      # boot, logins and downloads around a 1 to 7s crane copy.
      - name: Install crane (pinned)
        run: |
          CRANE_VERSION=v0.21.7
          CRANE_SHA256=1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c
          tar xzf crane.tar.gz crane
          sudo mv crane /usr/local/bin/

      - name: Reuse the unchanged image
        if: ${{ matrix.reuse }}
        # Inputs identical to the image already deployed on this branch: point
        # the new sha tag at that digest, no build (see reuse_unchanged_images).
        # The copies below then run unchanged.
        run: crane tag "${{ matrix.ghcr_image }}@${{ matrix.reuse_digest }}" "${{ github.sha }}"

      - name: Scan the reused image with Trivy
        if: ${{ matrix.reuse && inputs.skip_vulnerability_scan == false && inputs.rescan_reused_images }}
        # Same gate as a rebuild, with today's DB: a CVE published since the
        # image was built blocks the rollout here too.
        run: |
          trivy image \
            --skip-version-check \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "${{ matrix.ghcr_image }}@${{ matrix.reuse_digest }}"

      - name: Login to the other registries
        env:
          TARGETS: ${{ toJson(matrix.targets) }}
          REGISTRY_TOKEN: ${{ secrets.registry_token }}
          REGISTRY_TOKEN_2: ${{ secrets.registry_token_2 }}
          ACTOR: ${{ github.actor }}
        run: |
          # crane reads ~/.docker/config.json, so the ghcr login above already
          # covers the copy source. First non-ghcr registry uses registry_token,
          # second uses registry_token_2, same rule as the inputs document.
          jq -c '.[] | select(.registry != "ghcr.io")' <<< "$TARGETS" | while read -r t; do
            registry=$(jq -r .registry <<< "$t")
            user=$(jq -r '.registry_username // ""' <<< "$t"); [ -n "$user" ] || user="$ACTOR"
            token="$REGISTRY_TOKEN"; [ "$(jq -r .non_ghcr_index <<< "$t")" = 2 ] && token="$REGISTRY_TOKEN_2"
            echo "$token" | crane auth login "$registry" -u "$user" --password-stdin
          done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ join(matrix.targets.*.image, ',') }}

      - name: Copy image to every registry (same digest) and apply tags
        env:
          TARGETS: ${{ toJson(matrix.targets) }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SRC: ${{ matrix.ghcr_image }}:${{ github.sha }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/image-data
          jq -c '.[]' <<< "$TARGETS" | while read -r t; do
            image=$(jq -r .image <<< "$t"); dst="$image:$SHA"
            [ "$SRC" = "$dst" ] || crane copy "$SRC" "$dst"
            jq -nc --arg name "$image" --arg digest "$(crane digest "$dst")" --arg ref_name "$REF_NAME" \
              --arg registry "$(jq -r .registry <<< "$t")" --arg push_id "$(jq -r .push_id <<< "$t")" \
              '{name: $name, digest: $digest, ref_name: $ref_name, registry: $registry, push_id: $push_id}' \
              > "/tmp/image-data/$(jq -r .push_id <<< "$t").json"
          done
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            crane tag "${ref%:*}:$SHA" "${ref##*:}"
          done <<< "$TAGS"

      - name: Upload image data artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-data-c${{ matrix.id }}
          path: /tmp/image-data/*.json
          retention-days: 1

  publish-chart:
    if: inputs.helm_chart_path != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.helm_chart_path }}
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        # helm's own login: no Node action boot, no post-job logout step
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Render chart
        # A failing render is the signal; the manifest itself goes to
        # /dev/null (thousands of log lines otherwise).
        env:
          RENDER_ARGS: ${{ inputs.helm_chart_render_args }}
        run: |
          if [ -z "$RENDER_ARGS" ]; then
            helm template . > /dev/null
            exit 0
          fi
          while IFS= read -r line; do
            [ -z "$line" ] || helm template . $line > /dev/null
          done <<< "$RENDER_ARGS"

      - name: Chart version
        id: version
        # Same ref rules as set-branch below: tag → release, stage → rc,
        # every other branch → dev.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)      v="1.0.${GITHUB_RUN_NUMBER}" ;;
            refs/heads/stage) v="1.0.${GITHUB_RUN_NUMBER}-rc" ;;
            *)                v="1.0.${GITHUB_RUN_NUMBER}-dev" ;;
          esac
          echo "chart_version=$v" >> "$GITHUB_OUTPUT"
          echo "$v"

      - name: Package and push chart
        run: |
          tgz=$(helm package --version "${{ steps.version.outputs.chart_version }}" . | sed 's/.*saved it to: //')
          helm push "$tgz" "oci://ghcr.io/${GITHUB_REPOSITORY,,}/helm"

  update-manifest:
    runs-on: ubuntu-latest
    needs: [define-matrix, build, publish-chart]
    # publish-chart is skipped when no chart path is given; a skipped need
    # would otherwise skip this job too
    if: ${{ !cancelled() && needs.define-matrix.result == 'success' && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.publish-chart.result) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.define-matrix.outputs.manifest_matrix) }}
    steps:
      - name: Download all image data
        uses: actions/download-artifact@v8
        with:
          path: /tmp/image-data
          pattern: image-data-*
          merge-multiple: true

      - name: Process images for this registry
        id: aggregate
        run: |
          registry="${{ matrix.registry }}"
          images=$(jq -sc "[.[] | select(.registry == \"$registry\")]" /tmp/image-data/*.json)
          echo "images=$images" >> $GITHUB_OUTPUT
          echo "Images for $registry: $images"

      - name: Set branch name
        id: set-branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "branch=prod" >> $GITHUB_OUTPUT
            echo "branch=prod"
          fi
          if [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "branch=dev"
          fi
          if [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "branch=dev (src:develop => dst:dev)"
          fi
          if [[ "${{ github.ref }}" == refs/heads/test ]]; then
            echo "branch=test" >> $GITHUB_OUTPUT
            echo "branch=test"
          fi
          if [[ "${{ github.ref }}" == refs/heads/stage ]]; then
            echo "branch=stage" >> $GITHUB_OUTPUT
            echo "branch=stage"
          fi

      - name: Deploy application
        if: steps.set-branch.outputs.branch != ''
        run: |
          payload=$(cat <<EOF
          {
            "event_type": "update-manifest",
            "client_payload": {
              "repo_name": "${{ env.CD_REPO }}",
              "repo_org": "${{ env.CD_ORG }}",
              "branch": "${{ steps.set-branch.outputs.branch }}",
              "images": ${{ steps.aggregate.outputs.images }},
              "create_pull_request": ${{ env.CREATE_PULL_REQUEST }},
              "helm_chart_name": "${{ inputs.helm_chart_name }}",
              "helm_chart_version": "${{ needs.publish-chart.outputs.chart_version || inputs.helm_chart_version }}",
              "triggered_by": "${{ github.actor }}",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
          }
          EOF
          ) && \
          echo "Deploying to ${{ matrix.argo_repository }}" && \
          echo "Payload: $payload" && \
          curl --fail -X POST \
          -H "Authorization: Bearer ${{ secrets.token }}" \
          https://api.github.com/repos/${{ matrix.argo_repository }}/dispatches \
          -d "$payload"
