---
name: registry-scan

# Reusable scheduled vulnerability scan for images already pushed to ghcr.
# Findings are uploaded as SARIF, so each CVE becomes a code scanning
# alert, and GitHub closes it when a later scan no longer reports it.
# Call it from a thin cron wrapper in your repo:
#
#   name: registry-scan
#   on:
#     schedule:
#       - cron: "0 3 * * 0"
#     workflow_dispatch:
#   permissions:
#     contents: read
#     packages: read
#     security-events: write
#     actions: read
#   jobs:
#     scan:
#       uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/registry-scan.yml@v4.0.0
#       with:
#         images: '["epfl-enac/epfl/co2-calculator/frontend","epfl-enac/epfl/co2-calculator/backend"]'

on:
  workflow_call:
    inputs:
      images:
        required: true
        type: string
        description: |
          JSON array of ghcr image paths, without the ghcr.io/ prefix,
          e.g. '["epfl-enac/epfl/co2-calculator/frontend"]'.
          For each image, the newest release tag (v*) plus the mutable
          dev/stage tags are scanned. Findings become code scanning
          alerts in the calling repo, one category per image and slot
          (release, dev, stage).

jobs:
  list-tags:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      targets: ${{ steps.tags.outputs.targets }}

    steps:
      - name: Install crane (pinned)
        run: |
          # Version-pinned with a hardcoded checksum: installing from a live
          # source would run whatever it serves that day as root.
          CRANE_VERSION=v0.21.7
          CRANE_SHA256=1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c
          tar xzf crane.tar.gz crane
          sudo mv crane /usr/local/bin/

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: List tags to scan
        id: tags
        # Explicit bash adds pipefail: a malformed `images` input must fail
        # here, not yield an empty target list and a green run.
        shell: bash
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          # Scan only images that can actually run: the newest release tag
          # (prod) plus the mutable dev/stage tags. Older releases are
          # immutable and inevitably rot, which would raise an unactionable
          # alert per historical tag. ("latest" mirrors the newest release.)
          jq -r '.[]' <<< "$IMAGES" | while read -r image; do
            tags=$(crane ls "ghcr.io/$image")
            # Final releases only: sort -V ranks v1.2.0-rc1 above v1.2.0.
            release=$(grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' <<< "$tags" | sort -V | tail -n1 || true)
            if [ -n "$release" ]; then
              jq -nc --arg image "$image" --arg tag "$release" '{image: $image, tag: $tag, slot: "release"}'
            fi
            for tag in $(grep -Ex 'dev|stage' <<< "$tags" || true); do
              jq -nc --arg image "$image" --arg tag "$tag" '{image: $image, tag: $tag, slot: $tag}'
            done
          done > targets.jsonl
          echo "targets=$(jq -sc . targets.jsonl)" >> "$GITHUB_OUTPUT"

  scan:
    needs: list-tags
    if: needs.list-tags.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.list-tags.outputs.targets) }}

    steps:
      # upload-sarif resolves the commit and alert fingerprints from a checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Trivy (pinned)
        run: |
          # Version-pinned with a hardcoded checksum: installing from a live
          # apt repo or action would run whatever it serves that day as root.
          TRIVY_VERSION=0.76.2
          TRIVY_SHA256=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c
          # Same tarball and checksum as deploy.yml: one static binary, and
          # dpkg spends ~3s reading the package db.
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 755 trivy /usr/local/bin/trivy

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Scan image
        # Outside the checkout: Trivy reads .trivyignore and trivy.yaml from
        # the working directory, and a caller file would drop a CVE from the
        # upload, which closes its alert as fixed.
        working-directory: ${{ runner.temp }}
        env:
          IMAGE: ${{ matrix.target.image }}
          TAG: ${{ matrix.target.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # job.workflow_ref/_sha, not github.*: in a called workflow
          # github.workflow_ref names the caller, job.* names this file.
          # Passed as JSON because actionlint does not know these fields yet.
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          WORKFLOW_REF=$(jq -r '.workflow_ref // empty' <<< "$JOB_CONTEXT")
          WORKFLOW_SHA=$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")
          if [ -z "$WORKFLOW_REF" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_ref/workflow_sha missing: alerts would not say which workflow found them"
            exit 1
          fi
          export WORKFLOW_REF WORKFLOW_SHA
          # No --exit-code: findings must not fail the job, the alerts are
          # the signal.
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy.sarif \
            "ghcr.io/$IMAGE:$TAG"
          # The alert page shows only the tool name ("Trivy") and the result
          # message. Trace every alert there: which workflow at which commit,
          # which Trivy and DB, which image digest, which run.
          scanner=$(trivy version --format json | jq -r '"Trivy \(.Version), vulnerability DB updated \(.VulnerabilityDB.UpdatedAt)"')
          jq --arg scanner "$scanner" '.runs[] |= (.properties as $p | .results[]?.message.text +=
            "\n\nFound by: \(env.WORKFLOW_REF) at \(env.WORKFLOW_SHA)\nScanner: \($scanner)\nImage: \($p.imageName)\nDigest: \($p.repoDigests[0] // "unknown")\nRun: \(env.RUN_URL)")' \
            trivy.sarif > tagged.sarif
          mv tagged.sarif trivy.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          # The slot, not the version, names the category, so a new
          # release replaces the previous release's alerts.
          category: registry-scan/${{ matrix.target.image }}:${{ matrix.target.slot }}
